<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Incident Reporting System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚨 Cyber Incident Reporting System</h1>

<div class="form-container">
  <input type="text" id="title" placeholder="Incident Title">

  <select id="type">
    <option value="">Incident Type</option>
    <option>Malware</option>
    <option>Phishing</option>
    <option>DDoS</option>
    <option>Unauthorized Access</option>
  </select>

  <select id="severity">
    <option value="">Severity Level</option>
    <option>Low</option>
    <option>Medium</option>
    <option>High</option>
    <option>Critical</option>
  </select>

  <textarea id="description" placeholder="Incident Description"></textarea>

  <button onclick="addIncident()">Submit Incident</button>
</div>

<h2>📋 Reported Incidents</h2>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Type</th>
        <th>Severity</th>
        <th>Description</th>
        <th>Date</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="incidentList"></tbody>
  </table>
</div>

<script src="script.js"></script>
</body>
</html>
